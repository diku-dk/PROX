import                = setup_default_files.cfg
import                = setup_default_rendering.cfg
import                = setup_default_simulation.cfg

#--- Setup File Parameters -------------------------------
xml_load_scene_file   = ccd_tight_space_drop.xml
xml_save_scene_file   = ccd_tight_space_drop.xml
xml_load_channel_file = ccd_tight_space_drop_channels.xml
xml_save_channel_file = ccd_tight_space_drop_channels.xml

#--- Setup Simulation Parameters ------------------------------
max_iteration         = 1000
absolute_tolerance    = 0.0
relative_tolerance    = 0.0
total_time            = 8.0

contact_algorithm      = opposing

#--- Setup Scene Parameters ------------------------------
procedural_scene      = ccd_tight_space_drop
procedural_param_1    = 20        # scene size

#--- Setup Rendering Parameters --------------------------
camera_position_x = 5.5
camera_position_y = 4.75
camera_position_z = -12+.5

camera_target_x   = 0.0
camera_target_y   = 0.0
camera_target_z   = 0.0

light1_position_x   = 20.0
light1_position_y   = 10.0
light1_position_z   = 30.0

light0_position_x   =  30.0
light0_position_y   =  10.0
light0_position_z   =  20.0

show_sdf_representation  = false
draw_wireframe           = true
bounce_on                = true
draw_aabb                = false
draw_contacts            = true
draw_contacts_scaling    = 0.5
draw_debug               = true
profiling                = false
framegrab                = false
save_contact_data        = false
matlab_file              = ccd_tight_space_drop_profiling.m
framegrab_file           = ccd_tight_space_drop_
#xml_auto_save            = false
#xml_record               = false
